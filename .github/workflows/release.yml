name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RON_Server-Browser.sln

      - name: Build
        run: dotnet build RON_Server-Browser.sln -c Release --no-restore

      - name: Publish
        run: |
          dotnet publish RON_Server-Browser/RON_Server-Browser.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o ./publish

      - name: Create archive
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path ./publish/* -DestinationPath "RON_Server-Browser-${tag}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            RON_Server-Browser-*-win-x64.zip
